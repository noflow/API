name: "CWNHL Scraper Cron"

on:
  schedule:
    # Runs during league nights, Thursday-Sunday Pacific time.
    # These UTC times cover 5:45pm-9:30pm PT during the current season.
    - cron: "45 0 * * 5,6,0,1"
    - cron: "0,15,30,45 1-3 * * 5,6,0,1"
    - cron: "0,15,30 4 * * 5,6,0,1"
  workflow_dispatch:

concurrency:
  group: cwnhl-scraper-cron
  cancel-in-progress: false

jobs:
  scraper-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      SCHEDULE_SHEET_ID: ${{ secrets.SCHEDULE_SHEET_ID }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      GOOGLE_CREDENTIALS_FILE: google_credentials.json
      EA_NHL_GAME_SLUG: nhl-26
      EA_PLATFORM: common-gen5
      EA_MATCH_TYPE: club_private
      LAGOUT_MERGE_WINDOW_MINUTES: 30
      LAGOUT_HOLD_MINUTES: 45
      LEAGUE_TIMEZONE: America/Los_Angeles
      LEAGUE_GAME_DAYS: thu,fri,sat,sun
      LEAGUE_START_TIME: "17:45"
      LEAGUE_END_TIME: "20:30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread oauth2client python-dotenv requests

      - name: Write Google credentials
        shell: bash
        run: |
          if [ -z "$GOOGLE_CREDS_JSON" ]; then
            echo "GOOGLE_CREDS_JSON secret is missing."
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDS_JSON" > "$GOOGLE_CREDENTIALS_FILE"

      - name: Run scraper cron
        run: python scraper_cron.py
