name: Scraper: Mondays & Tuesdays 5–9:30pm PT

on:
  schedule:
    # Monday PT → Tuesday UTC
    - cron: '0 0 * * 2'
    - cron: '30 0 * * 2'
    - cron: '0 1 * * 2'
    - cron: '30 1 * * 2'
    - cron: '0 2 * * 2'
    - cron: '30 2 * * 2'
    - cron: '0 3 * * 2'
    - cron: '30 3 * * 2'
    - cron: '0 4 * * 2'
    - cron: '30 4 * * 2'
    # Tuesday PT → Wednesday UTC
    - cron: '0 0 * * 3'
    - cron: '30 0 * * 3'
    - cron: '0 1 * * 3'
    - cron: '30 1 * * 3'
    - cron: '0 2 * * 3'
    - cron: '30 2 * * 3'
    - cron: '0 3 * * 3'
    - cron: '30 3 * * 3'
    - cron: '0 4 * * 3'
    - cron: '30 4 * * 3'

  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client py
